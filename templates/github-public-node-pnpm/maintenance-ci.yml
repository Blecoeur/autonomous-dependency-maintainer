# Maintenance CI wrapper for the consumer repository.
# Install at .github/workflows/maintenance-ci.yml
#
# Replace YOUR_ORG and pin the framework to an immutable tag or full commit
# SHA. Never reference @main: the framework is part of the trust chain.
#
# Required configuration on the consumer repository (Settings):
# - Branch protection on main requiring: dependency-ci AND maintenance-policy.
# - "Allow auto-merge" enabled in repository settings.

name: Maintenance CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-ci:
    uses: YOUR_ORG/autonomous-dependency-maintainer/.github/workflows/node-pnpm-ci.yml@FRAMEWORK_SHA_OR_TAG
    with:
      node-version: '24'
      install-command: 'pnpm install --frozen-lockfile'
      build-command: 'pnpm build'
      test-command: 'pnpm test'

  maintenance-policy:
    if: github.event_name == 'pull_request'
    uses: YOUR_ORG/autonomous-dependency-maintainer/.github/workflows/policy-check.yml@FRAMEWORK_SHA_OR_TAG
    with:
      pr-number: ${{ github.event.pull_request.number }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      framework-repository: YOUR_ORG/autonomous-dependency-maintainer
      framework-ref: FRAMEWORK_SHA_OR_TAG
