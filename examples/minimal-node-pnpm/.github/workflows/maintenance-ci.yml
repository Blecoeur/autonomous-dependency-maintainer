name: Maintenance CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-ci:
    uses: Blecoeur/autonomous-dependency-maintainer/.github/workflows/node-pnpm-ci.yml@v0.2.0
    with:
      node-version: '24'
      install-command: 'pnpm install --frozen-lockfile'
      build-command: ''
      test-command: 'pnpm test'
      smoke-command: 'pnpm smoke'

  maintenance-policy:
    if: github.event_name == 'pull_request'
    uses: Blecoeur/autonomous-dependency-maintainer/.github/workflows/policy-check.yml@v0.2.0
    with:
      pr-number: ${{ github.event.pull_request.number }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      framework-repository: Blecoeur/autonomous-dependency-maintainer
      framework-ref: v0.2.0
