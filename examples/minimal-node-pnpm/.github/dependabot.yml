version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - infrastructure
