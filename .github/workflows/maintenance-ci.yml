# Maintenance policy check for the framework repository itself.
#
# Self-hosting: this wrapper calls the framework's own reusable policy
# check, pinned at the last RELEASED version (never main). A PR that
# modifies the policy engine is therefore evaluated by the previously
# released engine — the same no-self-weakening principle that makes the
# consumer config be read from the base branch.
#
# The framework keeps its own CI (framework-ci.yml: build-and-test) as the
# required build/test check; this adds the policy decision on top.

name: Maintenance CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  maintenance-policy:
    if: github.event_name == 'pull_request'
    uses: Blecoeur/autonomous-dependency-maintainer/.github/workflows/policy-check.yml@v0.1.8
    with:
      pr-number: ${{ github.event.pull_request.number }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      framework-repository: Blecoeur/autonomous-dependency-maintainer
      framework-ref: v0.1.8
